spring.application.name=sms-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/sms}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:chenshuzhu}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

app.jwt.secret=${APP_JWT_SECRET:demo-jwt-secret-change-me-for-production}
app.jwt.expiration-seconds=${APP_JWT_EXPIRATION_SECONDS:3600}
app.demo-user.username=${APP_DEMO_USER_USERNAME:admin}
app.demo-user.password=${APP_DEMO_USER_PASSWORD:admin123}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

downstream.url=${DOWNSTREAM_URL:http://35.160.178.69:8080/name/aggregation}
aggregation.service-name=${AGGREGATION_SERVICE_NAME:}
aggregation.downstream.timeout=${AGGREGATION_DOWNSTREAM_TIMEOUT:2s}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
