spring.application.name=sms-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sms}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chenshuzhu}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update

downstream.url=${DOWNSTREAM_URL:http://35.160.178.69:8080/name/aggregation}
aggregation.service-name=${AGGREGATION_SERVICE_NAME:}
aggregation.downstream.timeout=${AGGREGATION_DOWNSTREAM_TIMEOUT:2s}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
