spring.datasource.url=jdbc:h2:mem:sms_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
app.jwt.secret=test-jwt-secret-with-enough-length
app.jwt.expiration-seconds=3600
app.demo-user.username=admin
app.demo-user.password=admin123
spring.kafka.bootstrap-servers=localhost:9092,localhost:9094,localhost:9096
spring.kafka.admin.auto-create=false
spring.kafka.listener.auto-startup=false
downstream.url=http://localhost:8081/name/aggregation
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
