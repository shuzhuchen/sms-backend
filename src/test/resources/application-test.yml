spring:
  datasource:
    url: jdbc:h2:mem:sms_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

downstream:
  url: http://localhost:8081/name/aggregation

aggregation:
  service-name: TestService
  downstream:
    timeout: 100ms

resilience4j:
  circuitbreaker:
    instances:
      nameAggregationDownstream:
        failure-rate-threshold: 50
        sliding-window-size: 2
        minimum-number-of-calls: 1
        wait-duration-in-open-state: 100ms
        permitted-number-of-calls-in-half-open-state: 1
  retry:
    instances:
      nameAggregationDownstream:
        max-attempts: 1
        wait-duration: 10ms
